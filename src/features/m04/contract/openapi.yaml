openapi: 3.0.3

info:
  title: Entre Ser · M04 Agendamento de Sessões
  version: 1.0.0
  description: |
    Contrato do módulo de Agendamento da plataforma Entre Ser.

    **Este arquivo é a fonte da verdade da integração.** O backend gera as interfaces
    Spring a partir dele (`openapi-generator`, `interfaceOnly=true`) e o frontend gera
    os tipos TypeScript (`openapi-typescript`). Nenhum endpoint existe fora daqui.

    ## Convenções

    - **Datas e horários:** todo `date-time` trafega em UTC, ISO-8601 com sufixo `Z`.
      Ex.: `2026-08-12T14:00:00Z`. A conversão para o fuso da usuária é responsabilidade
      exclusiva do frontend. Nunca trafega datetime sem offset.
    - **Horas de disponibilidade:** `horaInicio`/`horaFim` são hora local da profissional
      (`HH:mm`), não UTC. A geração de slots roda no fuso da profissional e só depois converte.
    - **Erros:** toda resposta de erro usa o schema `Erro`. O frontend exibe mensagem a
      partir do campo `code` — nunca do campo `message`, que é técnico.
    - **Regras de negócio:** vivem exclusivamente no backend. Campos calculados
      (`vagasDisponiveis`, `podeCancelarSemCobranca`, `exigePagamentoAntecipado`) são
      devolvidos prontos e nunca recalculados pelo frontend.
    - **Paginação:** toda listagem aceita `page` e `size` e devolve o envelope de página.

    ## Referências

    Decisões técnicas que originaram campos e endpoints não previstos na especificação
    original estão registradas em `DECISOES.md` (D1 a D14).

servers:
  - url: https://api-staging.entreser.com.br
    description: Staging
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: http://localhost:4010
    description: Mock (Prism)

security:
  - bearerAuth: []

tags:
  - name: profissional-agenda
    description: Configuração de disponibilidade, bloqueios e valores (PF1, PF2, PF3)
  - name: profissional-sessoes
    description: Agenda, criação de grupo, realização e presença (PF4, PF5, PF6)
  - name: usuaria-marcacao
    description: Descoberta de profissionais, slots e marcação (UF1, UF2, UF3, UF4)
  - name: usuaria-sessoes
    description: Minhas sessões, cancelamento e reagendamento (UF8, UF9)
  - name: grupo
    description: Sessões de grupo e inscrição (UF5)
  - name: catalogo
    description: Metadados estáveis consumidos pela interface
  - name: convites
    description: Convite de parceira para sessão de Casal (D4)
  - name: sessoes
    description: Operações comuns às duas personas

paths:

  # ─────────────────────────────────────────────────────────────
  # PROFISSIONAL · Configuração da agenda
  # ─────────────────────────────────────────────────────────────

  /profissional/disponibilidade:
    get:
      tags: [profissional-agenda]
      operationId: listarDisponibilidade
      summary: Lista a disponibilidade semanal da profissional autenticada
      description: PF1. Retorna todas as faixas cadastradas, inclusive as inativas.
      responses:
        '200':
          description: Disponibilidade semanal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeSemanal'
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    put:
      tags: [profissional-agenda]
      operationId: definirDisponibilidade
      summary: Substitui a disponibilidade semanal completa
      description: |
        PF1. Operação de substituição total, executada em transação: as faixas enviadas
        passam a ser as únicas existentes. Enviar `faixas: []` limpa a agenda.

        Não cancela sessões já marcadas fora das novas faixas — sessões existentes são
        preservadas e devolvidas em `sessoesForaDaNovaAgenda` para que a profissional
        decida o que fazer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadeSemanalInput'
      responses:
        '200':
          description: Disponibilidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeAtualizadaResponse'
        '400':
          description: |
            Faixa inválida. Códigos possíveis: `FAIXA_INVALIDA` (horaFim <= horaInicio),
            `FAIXAS_SOBREPOSTAS` (duas faixas do mesmo dia se cruzam),
            `INTERVALO_INVALIDO` (intervaloMinutos negativo ou maior que 120).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /profissional/bloqueios:
    get:
      tags: [profissional-agenda]
      operationId: listarBloqueios
      summary: Lista os bloqueios de agenda
      description: PF2. Por padrão retorna apenas bloqueios que ainda não terminaram.
      parameters:
        - name: incluirPassados
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Bloqueios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaBloqueios' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    post:
      tags: [profissional-agenda]
      operationId: criarBloqueio
      summary: Cria um bloqueio de agenda
      description: |
        PF2. O bloqueio remove slots futuros do período, mas **não cancela** sessões
        já marcadas. As sessões existentes no período são devolvidas em
        `sessoesAfetadas` para que a profissional as cancele manualmente, uma a uma.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BloqueioInput' }
      responses:
        '201':
          description: Bloqueio criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloqueioCriadoResponse' }
        '400':
          description: '`PERIODO_INVALIDO` — dataFim anterior ou igual a dataInicio.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /profissional/bloqueios/{bloqueioId}:
    delete:
      tags: [profissional-agenda]
      operationId: removerBloqueio
      summary: Remove um bloqueio de agenda
      description: PF2. Os slots do período voltam a ser gerados imediatamente.
      parameters:
        - $ref: '#/components/parameters/BloqueioId'
      responses:
        '204': { description: Bloqueio removido }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /profissional/valores:
    get:
      tags: [profissional-agenda]
      operationId: listarValores
      summary: Lista os valores por tipo de sessão
      description: |
        PF3. Retorna os cinco tipos de sessão. Tipos sem valor definido vêm com
        `valor: null` e significam que a profissional **não oferece** aquele tipo.
      responses:
        '200':
          description: Valores por tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValoresSessaoResponse' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    put:
      tags: [profissional-agenda]
      operationId: definirValores
      summary: Define os valores por tipo de sessão
      description: |
        PF3. Substituição total. Enviar `valor: null` para um tipo remove a oferta
        daquele tipo. Não afeta o `valorPraticado` de sessões já marcadas, que é um
        snapshot tirado no momento do agendamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValoresSessaoInput' }
      responses:
        '200':
          description: Valores atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValoresSessaoResponse' }
        '400':
          description: '`VALOR_INVALIDO` — valor negativo ou zero.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  # ─────────────────────────────────────────────────────────────
  # PROFISSIONAL · Sessões
  # ─────────────────────────────────────────────────────────────

  /profissional/agenda:
    get:
      tags: [profissional-sessoes]
      operationId: listarAgenda
      summary: Lista as sessões da profissional autenticada
      description: |
        PF5. Inclui sessões individuais marcadas e sessões de grupo criadas.

        **Janela default sugerida ao abrir a tela:** `de = hoje − 14 dias`,
        `ate = hoje + 30 dias`. As sessões que aguardam registro estão no passado; uma
        janela que começa hoje esconderia as pendências — exatamente o modo de falha que
        os filtros `pendenteRegistro`/`linkMeetStatus` existem para evitar. Os atalhos de
        período ("esta semana", "este mês") continuam como filtro, não como default.
      parameters:
        - name: de
          in: query
          required: true
          description: Início do período (inclusivo), UTC.
          schema: { type: string, format: date-time }
          example: '2026-08-01T00:00:00Z'
        - name: ate
          in: query
          required: true
          description: Fim do período (exclusivo), UTC.
          schema: { type: string, format: date-time }
          example: '2026-08-31T23:59:59Z'
        - name: status
          in: query
          required: false
          description: Filtra por um ou mais status. Ausente, retorna todos.
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusSessao' }
          style: form
          explode: false
        - name: tipo
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/TipoSessao' }
          style: form
          explode: false
        - name: pendenteRegistro
          in: query
          required: false
          description: |
            `true` devolve apenas sessões cujo horário já passou e que continuam em
            `Agendada`/`Confirmada` — as que aguardam o registro da profissional.

            **Existe para o destaque de pendências da tela de agenda.** Filtrar no
            cliente só alcançaria a página carregada: com 20 itens por página, uma
            pendência na página 3 ficaria invisível, e "a profissional não vê que
            precisa agir" é o pior modo de falha do painel.
          schema: { type: boolean }
        - name: linkMeetStatus
          in: query
          required: false
          description: |
            Filtra pela situação da sala. `Falhou` devolve as sessões que precisam de
            link manual — a segunda pendência do painel. Mesmo motivo do parâmetro acima.
          schema:
            type: array
            items: { $ref: '#/components/schemas/LinkMeetStatus' }
          style: form
          explode: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Ordem'
      responses:
        '200':
          description: |
            Sessões da profissional. O envelope traz `totalPendenteRegistro` e
            `totalLinkMeetFalhou` calculados sobre **todo o período consultado**, não
            sobre a página — é o que alimenta as contagens do destaque de pendências
            sem exigir uma segunda requisição.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAgenda' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /profissional/agenda/resumo:
    get:
      tags: [profissional-sessoes]
      operationId: resumoAgenda
      summary: Contagens do painel da agenda, agregadas no servidor
      description: |
        As cinco métricas do topo de PF5, prontas. **Não aceita parâmetros**: os recortes
        de cada uma são fixos e definidos no servidor (ver a descrição de cada campo).

        **Existe para o painel não ser montado com uma requisição por número.** Antes,
        a tela disparava quatro `GET /profissional/agenda` com `size=1` só para ler os
        totais do envelope, e uma quinta com `size=100` para somar a receita no cliente —
        a única parte da tela que supunha um volume máximo de sessões. Aqui a soma é do
        servidor, que é quem sabe o total de verdade.
      responses:
        '200':
          description: Contagens do período corrente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoAgenda' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /profissional/sessoes/grupo:
    post:
      tags: [profissional-sessoes]
      operationId: criarSessaoGrupo
      summary: Cria uma sessão de grupo
      description: |
        PF4. Válido apenas para `RodaConversa` e `TerapiaGrupo`. A sessão nasce com
        `status: Agendada` e zero participantes, e fica visível na lista pública.

        Limites de capacidade (D11, configuráveis): Roda de Conversa 3 a 12,
        Terapia em Grupo 3 a 8.

        Exige valor definido para o tipo (PF3) — sem valor, a profissional não oferece
        aquele tipo e a criação é recusada com `VALOR_NAO_DEFINIDO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessaoGrupoInput' }
      responses:
        '201':
          description: Sessão de grupo criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `TIPO_NAO_E_GRUPO`, `CAPACIDADE_INVALIDA`,
            `VALOR_NAO_DEFINIDO`, `ANTECEDENCIA_MINIMA`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409':
          description: '`CONFLITO_HORARIO` — a profissional já tem sessão nesse horário.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /sessoes/{sessaoId}/realizada:
    patch:
      tags: [profissional-sessoes]
      operationId: marcarSessaoRealizada
      summary: Marca a sessão como realizada
      description: |
        PF6. Só é permitido após `dataHora` ter passado e a partir de
        `Agendada` ou `Confirmada`. `Realizada` é estado final e imutável.

        Em sessões de grupo, marque a presença individual de cada participante
        (`PATCH /sessoes/{id}/participantes/{participanteId}`) **antes** desta chamada.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Sessão marcada como realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `SESSAO_NAO_OCORREU_AINDA` (dataHora no futuro),
            `TRANSICAO_INVALIDA` (sessão já está em estado final).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/nao-compareceu:
    patch:
      tags: [profissional-sessoes]
      operationId: marcarNaoCompareceu
      summary: Marca a sessão como não comparecida
      description: |
        PF6. Aplicável a sessões individuais. Estado final e imutável.
        Incrementa o histórico de faltas da usuária, refletido em
        `noShowCount` e `exigePagamentoAntecipado` (D5).
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Sessão marcada como não comparecida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: 'Códigos possíveis: `SESSAO_NAO_OCORREU_AINDA`, `TRANSICAO_INVALIDA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/participantes/{participanteId}:
    patch:
      tags: [profissional-sessoes]
      operationId: marcarPresencaParticipante
      summary: Marca a presença de um participante em sessão de grupo
      description: PF6. Deve ser feito antes de marcar a sessão como realizada.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
        - name: participanteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compareceu]
              properties:
                compareceu: { type: boolean }
      responses:
        '200':
          description: |
            Presença registrada. Devolve a **sessão inteira atualizada**, não apenas o
            participante, para que a tela não precise de uma segunda requisição para
            se redesenhar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: 'Códigos possíveis: `SESSAO_NAO_E_GRUPO`, `SESSAO_NAO_OCORREU_AINDA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/link-meet:
    patch:
      tags: [profissional-sessoes]
      operationId: definirLinkMeetManual
      summary: Define manualmente o link da videochamada
      description: |
        D14. Caminho de contingência: se a criação automática do Meet falhar após as
        3 tentativas, a profissional é notificada e cola aqui um link gerado à mão.
        Disponibiliza o link para as participantes imediatamente.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkMeet]
              properties:
                linkMeet:
                  type: string
                  format: uri
                  maxLength: 500
                  example: https://meet.google.com/abc-defg-hij
      responses:
        '200':
          description: Link definido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: 'Códigos possíveis: `LINK_INVALIDO`, `TRANSICAO_INVALIDA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  # ─────────────────────────────────────────────────────────────
  # USUÁRIA · Descoberta e marcação
  # ─────────────────────────────────────────────────────────────

  /tipos-sessao:
    get:
      tags: [catalogo]
      operationId: listarTiposSessao
      summary: Catálogo dos tipos de sessão
      description: |
        Metadados dos cinco tipos: duração, faixa de participantes, categoria e texto
        de apresentação.

        **Existe para impedir que o frontend fixe regra de negócio em constante.**
        Sem este endpoint, a tela de escolha de tipo precisaria de um objeto com
        "Roda de Conversa, 60min, 3 a 12 pessoas" escrito no código — duplicando os
        limites que o backend usa para validar (D11) e criando duas fontes de verdade
        que divergem no dia em que a equipe Entre Ser confirmar outros números.

        Resposta estável: pode ser cacheada pelo frontend por sessão do navegador.
      responses:
        '200':
          description: Catálogo de tipos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TiposSessaoResponse' }
        '401': { $ref: '#/components/responses/Erro401' }

  /profissionais:
    get:
      tags: [usuaria-marcacao]
      operationId: listarProfissionais
      summary: Lista profissionais que oferecem um tipo de sessão
      description: |
        UF1. Retorna apenas profissionais ativas **e** com `ValorSessao` definido para
        o tipo solicitado. O campo `valor` já vem resolvido para o tipo consultado.
      parameters:
        - name: tipo
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TipoSessao' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Profissionais disponíveis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaProfissionais' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /profissionais/{profissionalId}:
    get:
      tags: [usuaria-marcacao]
      operationId: detalharProfissional
      summary: Perfil público de uma profissional
      description: |
        Perfil completo com todos os tipos oferecidos e seus valores.

        **Existe para sustentar deep link e recarga de página.** A listagem
        (`GET /profissionais`) devolve o resumo, mas a tela de perfil precisa
        funcionar quando a usuária chega por link direto ou aperta F5 — sem estado
        anterior em memória. Sem este endpoint, a tela quebraria no refresh e a
        solução improvisada seria refazer a listagem inteira e filtrar no cliente.
      parameters:
        - $ref: '#/components/parameters/ProfissionalId'
      responses:
        '200':
          description: Perfil da profissional
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfissionalDetalhe' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }

  /profissionais/{profissionalId}/slots:
    get:
      tags: [usuaria-marcacao]
      operationId: listarSlots
      summary: Lista os horários disponíveis de uma profissional
      description: |
        UF2. Executa o algoritmo de geração de slots (D1, D2, D3):

        1. Busca a disponibilidade ativa do dia da semana
        2. Gera slots com passo `duracao + intervaloMinutos`, incluindo apenas os que
           couberem inteiros até `horaFim`
        3. Remove os que caem em `BloqueioAgenda`
        4. Remove os que se sobrepõem a sessões `Agendada`/`Confirmada`, considerando
           o intervalo como folga dos dois lados da sessão existente
        5. Remove os que começam em menos de 24h

        A janela máxima consultável é de 90 dias.
      parameters:
        - $ref: '#/components/parameters/ProfissionalId'
        - name: tipo
          in: query
          required: true
          description: Define a duração usada na geração (50, 60 ou 90 minutos).
          schema: { $ref: '#/components/schemas/TipoSessao' }
        - name: inicio
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-08-01'
        - name: fim
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-08-31'
      responses:
        '200':
          description: |
            Slots disponíveis. Lista vazia é resposta válida (profissional sem
            disponibilidade, período todo bloqueado ou agenda cheia) — não é erro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotsResponse' }
        '400':
          description: |
            Códigos possíveis: `PERIODO_INVALIDO`, `JANELA_MUITO_LONGA` (acima de 90 dias),
            `VALOR_NAO_DEFINIDO` (a profissional não oferece esse tipo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes:
    post:
      tags: [usuaria-marcacao]
      operationId: marcarSessao
      summary: Marca uma sessão individual ou de casal
      description: |
        UF3 e UF4. Tipos aceitos: `Individual`, `Casal`, `Consultoria`.
        Para sessões de grupo use `POST /sessoes/{id}/inscrever`.

        A sessão nasce em `status: Agendada`, com `linkMeet: null` — o link é gerado
        por job 30 minutos antes do início (D14). `valorPraticado` é um snapshot do
        valor da profissional no momento da marcação.

        **Casal (D4):** informe `emailParceira`. Se o e-mail já pertence a uma usuária
        cadastrada, o `Participante` é criado direto e ela é notificada. Se não, é
        criado um `ConviteParticipante` e enviado o convite por e-mail. Em nenhum dos
        casos o convite bloqueia a sessão — ela é confirmada imediatamente.

        **Concorrência:** a proteção contra dupla marcação é garantida por constraint
        de exclusão no banco, não por verificação na aplicação (D10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcarSessaoInput' }
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `ANTECEDENCIA_MINIMA` (menos de 24h),
            `SLOT_INDISPONIVEL` (horário fora da disponibilidade ou em período bloqueado),
            `VALOR_NAO_DEFINIDO`, `TIPO_E_DE_GRUPO`, `EMAIL_PARCEIRA_INVALIDO`,
            `EMAIL_PARCEIRA_E_PROPRIO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409':
          description: |
            `SLOT_JA_OCUPADO` — outra usuária marcou esse horário primeiro.
            O frontend deve recarregar os slots e pedir nova escolha.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                code: SLOT_JA_OCUPADO
                message: Slot already booked by another user
                details:
                  dataHora: '2026-08-12T14:00:00Z'

  # ─────────────────────────────────────────────────────────────
  # SESSÕES DE GRUPO
  # ─────────────────────────────────────────────────────────────

  /grupos:
    get:
      tags: [grupo]
      operationId: listarSessoesGrupo
      summary: Lista as sessões de grupo abertas
      description: |
        UF5. Retorna apenas sessões com `dataHora` futura, `status: Agendada` e
        `vagasDisponiveis > 0`. O campo `vagasDisponiveis` já desconta as desistências
        (D7) — o frontend nunca calcula vagas.
      parameters:
        - name: tipo
          in: query
          required: false
          description: Apenas `RodaConversa` ou `TerapiaGrupo`.
          schema: { $ref: '#/components/schemas/TipoSessao' }
        - name: profissionalId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Sessões de grupo abertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaSessoes' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /grupos/{sessaoId}:
    get:
      tags: [grupo]
      operationId: detalharSessaoGrupo
      summary: Detalha uma sessão de grupo aberta (pré-inscrição)
      description: |
        UF5. A tela que precede o botão "Inscrever-se", acessível a **qualquer usuária
        autenticada** — não exige ser participante. Retorna a forma pública
        `SessaoGrupoPublica`: sem lista de `participantes`, sem `linkMeet` e sem histórico
        de outras usuárias. O campo `jaInscrita` diz se a usuária autenticada já está
        inscrita, para a tela decidir o rótulo do botão sem uma segunda requisição.

        Para o detalhe completo (já inscrita, ou a profissional), use `GET /sessoes/{sessaoId}`.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Detalhe público da sessão de grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoGrupoPublica' }
        '400':
          description: '`SESSAO_NAO_E_GRUPO` — o id não é de uma sessão de grupo.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/inscrever:
    post:
      tags: [grupo]
      operationId: inscreverEmGrupo
      summary: Inscreve a usuária autenticada em uma sessão de grupo
      description: |
        UF5. Valida vagas, prazo (24h de antecedência) e inscrição duplicada.
        Se a usuária já esteve inscrita e desistiu, uma nova inscrição é permitida
        desde que haja vaga.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '201':
          description: Inscrição realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `SESSAO_NAO_E_GRUPO`, `ANTECEDENCIA_MINIMA`,
            `TRANSICAO_INVALIDA` (sessão cancelada ou já realizada).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409':
          description: 'Códigos possíveis: `SESSAO_LOTADA`, `JA_INSCRITA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    delete:
      tags: [grupo]
      operationId: sairDeGrupo
      summary: Desiste de uma sessão de grupo
      description: |
        UF5. Soft delete — preenche `saiuEm` no `Participante`, liberando a vaga.
        O registro permanece no histórico e continua visível para a profissional.

        Permitido a qualquer momento. Com mais de 24h, sem cobrança; com menos de 24h,
        a resposta traz `cobrancaAplicada: true` (sem efeito financeiro no MVP). É a mesma
        regra do cancelamento de sessão individual — desistir tarde é permitido, cobrando
        o valor cheio.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Desistência registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelamentoResponse' }
        '400':
          description: '`NAO_INSCRITA` — a usuária não está inscrita nesta sessão.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }

  # ─────────────────────────────────────────────────────────────
  # USUÁRIA · Minhas sessões
  # ─────────────────────────────────────────────────────────────

  /usuaria/sessoes:
    get:
      tags: [usuaria-sessoes]
      operationId: listarMinhasSessoes
      summary: Lista as sessões da usuária autenticada
      description: |
        Inclui sessões individuais, de casal e inscrições em grupo.

        **Sessões de grupo das quais ela saiu ficam de fora por padrão** — "Minhas sessões"
        significa "as minhas". Para o histórico ("Anteriores"), `incluirSaidas=true` traz
        de volta o que ela já frequentou e depois deixou.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusSessao' }
          style: form
          explode: false
        - name: de
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: ate
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: incluirSaidas
          in: query
          required: false
          description: |
            `true` inclui sessões de grupo com `saiuEm` preenchido — as que ela abandonou.
            Só faz sentido em listagens de passado: em "Próximas", uma sessão da qual ela
            saiu não é dela.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Ordem'
      responses:
        '200':
          description: Sessões da usuária
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaSessoes' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /sessoes/{sessaoId}:
    get:
      tags: [sessoes]
      operationId: detalharSessao
      summary: Detalha uma sessão
      description: |
        Detalhe completo (`Sessao`). Acessível apenas pela profissional dona da sessão
        e pelas participantes; para as demais, `403`.

        **Sessão de grupo antes de inscrever:** quem ainda não é participante usa
        `GET /grupos/{sessaoId}`, que devolve a forma pública `SessaoGrupoPublica`
        (sem `participantes` nem `linkMeet`) com o campo `jaInscrita`.

        **Visibilidade do link (D14):** `linkMeet` só é preenchido a partir de 30
        minutos antes do início. Antes disso vem `null`, e `linkMeetDisponivelEm`
        informa o instante em que passará a existir. O frontend nunca decide essa
        regra — apenas exibe o que recebe.

        Campos `noShowCount` e `exigePagamentoAntecipado` das participantes são
        visíveis apenas para a profissional.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Detalhe da sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/cancelar:
    post:
      tags: [sessoes]
      operationId: cancelarSessao
      summary: Cancela uma sessão
      description: |
        UF8 e PF7. Permitido para a usuária participante e para a profissional.
        `Cancelada` é estado final e imutável.

        **Pela usuária:** com mais de 24h, sem cobrança. Com menos de 24h, a resposta
        traz `cobrancaAplicada: true` (sem efeito financeiro no MVP, pois o Módulo de
        Pagamento não está ativo). O frontend deve confirmar com a usuária antes de
        enviar quando `podeCancelarSemCobranca` for `false`.

        **Pela profissional:** permitido a qualquer momento, sem penalidade.

        Efeitos: notifica a outra parte, cancela o evento no Google Calendar se existir,
        e cancela convites pendentes.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  maxLength: 1000
                  description: Opcional. Exibido para a outra parte.
      responses:
        '200':
          description: Sessão cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelamentoResponse' }
        '400':
          description: '`TRANSICAO_INVALIDA` — a sessão já está em estado final.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sessoes/{sessaoId}/reagendar:
    patch:
      tags: [usuaria-sessoes]
      operationId: reagendarSessao
      summary: Reagenda uma sessão para outro horário
      description: |
        UF9. Mantém o mesmo registro de sessão (mesmo `id`, mesmos participantes) e
        altera apenas `dataHora`.

        **Bloqueio dentro de 24h (D9):** não é possível reagendar uma sessão que começa
        em menos de 24h — nesse caso resta cancelar. O horário de destino também precisa
        respeitar as 24h de antecedência. Os dois lados são validados.

        Efeitos colaterais obrigatórios: `linkMeet` volta a `null`, os lembretes já
        registrados são apagados para que os novos disparem, o evento antigo no Google
        Calendar é cancelado, e a profissional é notificada.

        Não se aplica a sessões de grupo.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHora]
              properties:
                dataHora:
                  type: string
                  format: date-time
                  description: Novo horário, UTC. Precisa ser um slot disponível.
                  example: '2026-08-20T17:00:00Z'
      responses:
        '200':
          description: Sessão reagendada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `PRAZO_REAGENDAMENTO` (sessão atual em menos de 24h),
            `ANTECEDENCIA_MINIMA` (novo horário em menos de 24h),
            `SLOT_INDISPONIVEL`, `SESSAO_E_DE_GRUPO`, `TRANSICAO_INVALIDA`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                code: PRAZO_REAGENDAMENTO
                message: Session starts in less than 24h and cannot be rescheduled
                details:
                  dataHoraAtual: '2026-07-28T10:00:00Z'
                  horasRestantes: 6
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409':
          description: '`SLOT_JA_OCUPADO` — o horário de destino foi ocupado.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  # ─────────────────────────────────────────────────────────────
  # CONVITES (D4)
  # ─────────────────────────────────────────────────────────────

  /convites/{token}:
    get:
      tags: [convites]
      operationId: consultarConvite
      summary: Consulta um convite pelo token
      description: |
        D4. **Endpoint público** — não exige autenticação, pois a convidada pode ainda
        não ter conta. Alimenta a tela de aceite do convite.

        O e-mail é devolvido mascarado para não expor o endereço a quem tenha o link.
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Dados públicos do convite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConvitePublico' }
        '404':
          description: '`CONVITE_INVALIDO` — token inexistente.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '410':
          description: '`CONVITE_EXPIRADO` — a sessão já passou ou o convite foi cancelado.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /convites/{token}/aceitar:
    post:
      tags: [convites]
      operationId: aceitarConvite
      summary: Aceita um convite de sessão de casal
      description: |
        D4. Exige autenticação — a convidada precisa ter se cadastrado antes.
        Cria o `Participante`, marca o convite como aceito e notifica quem convidou.

        O e-mail da usuária autenticada precisa ser o mesmo do convite.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Convite aceito, participante criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: |
            Códigos possíveis: `CONVITE_JA_ACEITO`,
            `EMAIL_NAO_CONFERE` (o e-mail da conta é diferente do e-mail convidado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404':
          description: '`CONVITE_INVALIDO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '410':
          description: '`CONVITE_EXPIRADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /sessoes/{sessaoId}/convite:
    delete:
      tags: [convites]
      operationId: cancelarConvite
      summary: Cancela o convite pendente de uma sessão de casal
      description: D4. Permitido apenas para a usuária que criou a sessão.
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Convite cancelado. Devolve a sessão atualizada, com `convitePendente` nulo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404':
          description: '`CONVITE_INVALIDO` — não há convite pendente nessa sessão.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

# ═════════════════════════════════════════════════════════════════
# COMPONENTES
# ═════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo M01. O papel (Usuária ou Profissional) vem no token.

  parameters:
    SessaoId:
      name: sessaoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfissionalId:
      name: profissionalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BloqueioId:
      name: bloqueioId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      description: Token opaco do convite, gerado com SecureRandom.
      schema: { type: string, minLength: 32, maxLength: 64 }
    Page:
      name: page
      in: query
      required: false
      description: Página, começando em zero.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Ordem:
      name: ordem
      in: query
      required: false
      description: |
        Ordem por `dataHora`. `asc` (padrão) para listas do futuro; `desc` para as abas
        "Anteriores", onde o topo deve ser o mais recente — sem isso, quanto mais histórico
        a conta acumula, mais para baixo (ou para a última página) vai o que interessa.

        Explícito de propósito: inverter sozinho quando o período é passado surpreenderia
        quem consulta uma janela que cruza o presente.
      schema: { type: string, enum: [asc, desc], default: asc }

  responses:
    Erro400:
      description: Requisição inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            code: PARAMETRO_INVALIDO
            message: Invalid request parameter
    Erro401:
      description: '`NAO_AUTENTICADO` — token ausente, inválido ou expirado.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            code: NAO_AUTENTICADO
            message: Missing or invalid authentication token
    Erro403:
      description: '`NAO_AUTORIZADO` — o recurso não pertence a quem está autenticado.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            code: NAO_AUTORIZADO
            message: Resource does not belong to the authenticated principal
    Erro404:
      description: '`RECURSO_NAO_ENCONTRADO`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            code: RECURSO_NAO_ENCONTRADO
            message: Resource not found

  schemas:

    # ── Erro ───────────────────────────────────────────────────

    Erro:
      type: object
      description: |
        Envelope único de erro. **O frontend exibe mensagem a partir de `code`**,
        através de um mapa `code → texto pt-BR`. O campo `message` é técnico,
        destinado a log, e nunca deve ser exibido nem comparado por texto.
      required: [code, message]
      properties:
        code:
          type: string
          description: Identificador estável do erro.
          example: ANTECEDENCIA_MINIMA
        message:
          type: string
          description: Descrição técnica em inglês, para log. Não exibir ao usuário.
          example: Session must be booked at least 24 hours in advance
        details:
          type: object
          additionalProperties: true
          description: Dados auxiliares específicos do erro.
          example:
            minimoHoras: 24
            dataHoraSolicitada: '2026-08-12T14:00:00Z'
      example:
        code: ANTECEDENCIA_MINIMA
        message: Session must be booked at least 24 hours in advance
        details:
          minimoHoras: 24

    # ── Enums ──────────────────────────────────────────────────

    TipoSessao:
      type: string
      description: |
        Tipo da sessão, que determina duração e número de participantes:
        `Individual` 50min / 1 · `Casal` 60min / 1-2 · `Consultoria` 60min / 1 ·
        `RodaConversa` 60min / 3-12 · `TerapiaGrupo` 90min / 3-8.
      enum: [Individual, Casal, Consultoria, RodaConversa, TerapiaGrupo]
      example: Individual

    StatusSessao:
      type: string
      description: |
        Estados finais e imutáveis: `Realizada`, `Cancelada`, `NaoCompareceu`.

        `Confirmada` existe no enum mas **não é atribuída no MVP** (D8): toda sessão
        nasce e permanece `Agendada` até um estado final. O frontend deve tratar
        `Agendada` e `Confirmada` como o mesmo estado visual.
      enum: [Agendada, Confirmada, Realizada, Cancelada, NaoCompareceu]
      example: Agendada

    DiaSemana:
      type: string
      enum: [Domingo, Segunda, Terca, Quarta, Quinta, Sexta, Sabado]
      example: Segunda

    CanceladoPor:
      type: string
      enum: [Usuaria, Profissional, Sistema]
      description: '`Sistema` indica cancelamento automático de grupo sem quórum.'
      example: Usuaria

    StatusConvite:
      type: string
      enum: [Pendente, Aceito, Expirado, Cancelado]
      example: Pendente

    LinkMeetStatus:
      type: string
      description: |
        Situação do link da videochamada (D14). Substitui um booleano simples porque
        a interface precisa distinguir três situações diferentes, e não duas:

        - `Agendado` — ainda não chegou a janela de 30 minutos. Exibir a hora prevista.
        - `Disponivel` — link criado. Exibir o botão de entrar na sala.
        - `Falhou` — as 3 tentativas se esgotaram. **Exibir para a profissional a ação
          de colar um link manual** (`PATCH /sessoes/{id}/link-meet`).
        - `NaoAplicavel` — sessão cancelada ou já encerrada.

        Sem o estado `Falhou`, a profissional não teria como localizar na agenda quais
        sessões precisam de ação, e a única saída seria uma rota nova só para listá-las.
      enum: [Agendado, Disponivel, Falhou, NaoAplicavel]
      example: Agendado

    Hora:
      type: string
      description: Hora local da profissional, formato `HH:mm` de 24 horas.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '09:00'

    # ── Paginação ──────────────────────────────────────────────

    Pagina:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }

    PaginaSessoes:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/SessaoResumo' }

    PaginaAgenda:
      description: |
        Página de sessões da profissional, com as contagens de pendência do período
        inteiro. Os dois totais ignoram os filtros de pendência aplicados — assim o
        destaque continua mostrando "3 aguardando registro" mesmo enquanto a lista
        está filtrada por eles.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [content, totalPendenteRegistro, totalLinkMeetFalhou]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/SessaoResumo' }
            totalPendenteRegistro:
              type: integer
              description: Sessões do período aguardando registro. Alimenta a contagem do destaque.
              example: 3
            totalLinkMeetFalhou:
              type: integer
              description: Sessões do período com `linkMeetStatus = Falhou`.
              example: 1

    ResumoAgenda:
      type: object
      description: |
        As cinco contagens do topo da agenda (PF5), cada uma com o seu próprio recorte
        de tempo — por isso um objeto só, e não um número por requisição.
      required:
        [proximos7Dias, canceladas14Dias, canceladasPelaUsuaria14Dias, pendenteRegistro,
         linkMeetFalhou, receitaPrevistaMes]
      properties:
        proximos7Dias:
          type: integer
          description: |
            Sessões `Agendada`/`Confirmada` com `dataHora` entre **agora** e agora+7 dias
            (rolante — não do início do dia).
          example: 6
        canceladas14Dias:
          type: integer
          description: |
            Canceladas cuja **`canceladaEm`** caiu nos últimos 14 dias — pela data do
            cancelamento, não pela da sessão. Um cancelamento feito hoje para uma sessão do
            mês que vem entra aqui; uma sessão da semana passada cancelada há meses, não.

            Cancelamentos sem `canceladaEm` (dado antigo) ficam de fora: não se sabe quando
            foram.
          example: 3
        canceladasPelaUsuaria14Dias:
          type: integer
          description: |
            Subconjunto de `canceladas14Dias` com `canceladaPor = Usuaria` — exclui o que a
            própria profissional cancelou.

            **É este que responde "desmarcaram comigo".** O total sozinho soma também as
            decisões dela, atribuindo a ela o que ela mesma fez.
          example: 2
        pendenteRegistro:
          type: integer
          description: |
            Sessões ativas cuja `dataHora` já passou e que seguem sem registro. **Sem piso
            inferior**: uma pendência de registro é acionável para sempre, e limitar a
            janela faria a mais antiga sumir justamente por ter sido esquecida por tempo
            demais.
          example: 0
        linkMeetFalhou:
          type: integer
          description: |
            Sessões com `linkMeetStatus = Falhou`, aguardando link manual, com `dataHora`
            entre −14 e +90 dias. **Mantém a janela de propósito** (ao contrário de
            `pendenteRegistro`): uma sala que falhou numa sessão já ocorrida não tem mais o
            que resolver.
          example: 0
        receitaPrevistaMes:
          type: number
          format: double
          description: |
            Soma de `valorPraticado` das sessões agendadas e realizadas do mês corrente.
            Somado no servidor: no cliente, dependia de baixar uma página de até 100
            itens e supor que cabia tudo nela.
          example: 830

    PaginaProfissionais:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ProfissionalResumo' }

    PaginaBloqueios:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/BloqueioAgenda' }

    # ── Disponibilidade ────────────────────────────────────────

    FaixaDisponibilidade:
      type: object
      required: [id, diaSemana, horaInicio, horaFim, intervaloMinutos, ativa]
      properties:
        id: { type: string, format: uuid }
        diaSemana: { $ref: '#/components/schemas/DiaSemana' }
        horaInicio: { $ref: '#/components/schemas/Hora' }
        horaFim: { $ref: '#/components/schemas/Hora' }
        intervaloMinutos:
          type: integer
          minimum: 0
          maximum: 120
          default: 10
          description: |
            Folga entre sessões consecutivas (D2). O passo de geração de slots é
            `duracao + intervaloMinutos`. Não editável na interface do MVP.
          example: 10
        ativa:
          type: boolean
          description: Permite desativar a faixa sem apagá-la.
          example: true

    DisponibilidadeSemanal:
      type: object
      required: [timezone, faixas]
      properties:
        timezone:
          type: string
          description: Fuso da profissional, usado na geração de slots (D14). Fixo no MVP.
          example: America/Sao_Paulo
        faixas:
          type: array
          items: { $ref: '#/components/schemas/FaixaDisponibilidade' }

    FaixaDisponibilidadeInput:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana: { $ref: '#/components/schemas/DiaSemana' }
        horaInicio: { $ref: '#/components/schemas/Hora' }
        horaFim: { $ref: '#/components/schemas/Hora' }
        intervaloMinutos:
          type: integer
          minimum: 0
          maximum: 120
          default: 10
        ativa: { type: boolean, default: true }

    DisponibilidadeSemanalInput:
      type: object
      required: [faixas]
      properties:
        faixas:
          type: array
          description: Conjunto completo de faixas. Substitui o que existia.
          items: { $ref: '#/components/schemas/FaixaDisponibilidadeInput' }
      example:
        faixas:
          - { diaSemana: Segunda, horaInicio: '09:00', horaFim: '12:00', intervaloMinutos: 10, ativa: true }
          - { diaSemana: Segunda, horaInicio: '14:00', horaFim: '18:00', intervaloMinutos: 10, ativa: true }
          - { diaSemana: Terca,   horaInicio: '14:00', horaFim: '18:00', intervaloMinutos: 10, ativa: true }

    DisponibilidadeAtualizadaResponse:
      type: object
      required: [disponibilidade, sessoesForaDaNovaAgenda]
      properties:
        disponibilidade: { $ref: '#/components/schemas/DisponibilidadeSemanal' }
        sessoesForaDaNovaAgenda:
          type: array
          description: |
            Sessões já marcadas que não cabem na nova disponibilidade. Não são
            canceladas — cabe à profissional decidir. Lista vazia é o caso comum.
          items: { $ref: '#/components/schemas/SessaoResumo' }

    # ── Bloqueio ───────────────────────────────────────────────

    BloqueioAgenda:
      type: object
      required: [id, dataInicio, dataFim, criadoEm]
      properties:
        id: { type: string, format: uuid }
        dataInicio: { type: string, format: date-time, example: '2026-12-20T00:00:00Z' }
        dataFim: { type: string, format: date-time, example: '2027-01-05T23:59:59Z' }
        criadoEm: { type: string, format: date-time }

    BloqueioInput:
      type: object
      required: [dataInicio, dataFim]
      properties:
        dataInicio: { type: string, format: date-time, example: '2026-12-20T00:00:00Z' }
        dataFim: { type: string, format: date-time, example: '2027-01-05T23:59:59Z' }

    BloqueioCriadoResponse:
      type: object
      required: [bloqueio, sessoesAfetadas]
      properties:
        bloqueio: { $ref: '#/components/schemas/BloqueioAgenda' }
        sessoesAfetadas:
          type: array
          description: |
            Sessões já marcadas dentro do período bloqueado. **Não são canceladas
            automaticamente.** O frontend deve listá-las e oferecer cancelamento
            individual.
          items: { $ref: '#/components/schemas/SessaoResumo' }

    # ── Valores ────────────────────────────────────────────────

    ValorSessao:
      type: object
      required: [tipoSessao, valor]
      properties:
        tipoSessao: { $ref: '#/components/schemas/TipoSessao' }
        valor:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: |
            Valor em reais **por participante** (D6). Numa Roda de Conversa com 8
            inscritas e valor 80,00, o bruto é R$ 640,00.
            `null` significa que a profissional não oferece esse tipo de sessão.
          example: 250.00
        atualizadoEm: { type: string, format: date-time, nullable: true }

    ValoresSessaoResponse:
      type: object
      required: [valores]
      properties:
        valores:
          type: array
          description: Sempre os cinco tipos. Os não oferecidos vêm com valor nulo.
          items: { $ref: '#/components/schemas/ValorSessao' }

    ValoresSessaoInput:
      type: object
      required: [valores]
      properties:
        valores:
          type: array
          items:
            type: object
            required: [tipoSessao, valor]
            properties:
              tipoSessao: { $ref: '#/components/schemas/TipoSessao' }
              valor:
                type: number
                format: double
                nullable: true
                minimum: 0
      example:
        valores:
          - { tipoSessao: Individual, valor: 250.00 }
          - { tipoSessao: Casal, valor: 350.00 }
          - { tipoSessao: Consultoria, valor: 300.00 }
          - { tipoSessao: RodaConversa, valor: 80.00 }
          - { tipoSessao: TerapiaGrupo, valor: null }

    # ── Profissional ───────────────────────────────────────────

    ProfissionalResumo:
      type: object
      required: [id, nome, crp]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Ana Souza }
        foto: { type: string, format: uri, nullable: true }
        crp: { type: string, example: 06/123456 }
        abordagem: { type: string, nullable: true, example: Terapia Cognitivo-Comportamental }
        bio: { type: string, nullable: true }
        valor:
          type: number
          format: double
          nullable: true
          description: Valor para o tipo consultado em `GET /profissionais?tipo=`.
          example: 250.00

    ProfissionalDetalhe:
      allOf:
        - $ref: '#/components/schemas/ProfissionalResumo'
        - type: object
          required: [tiposOferecidos]
          properties:
            tiposOferecidos:
              type: array
              description: |
                Apenas os tipos com valor definido. Já é a lista exata que a tela de
                perfil renderiza como opções de agendamento — o frontend não filtra nada.
              items: { $ref: '#/components/schemas/ValorSessao' }

    # ── Catálogo de tipos ──────────────────────────────────────

    TipoSessaoInfo:
      type: object
      required: [codigo, nome, duracaoMinutos, minParticipantes, maxParticipantes, categoria]
      properties:
        codigo: { $ref: '#/components/schemas/TipoSessao' }
        nome: { type: string, example: Roda de Conversa }
        duracaoMinutos: { type: integer, enum: [50, 60, 90], example: 60 }
        minParticipantes: { type: integer, example: 3 }
        maxParticipantes: { type: integer, example: 12 }
        categoria:
          type: string
          description: |
            `Individual` — a usuária escolhe profissional e slot.
            `Grupo` — a profissional cria a sessão e as usuárias se inscrevem.
            Determina qual fluxo de marcação a interface apresenta.
          enum: [Individual, Grupo]
          example: Grupo
        descricao: { type: string, example: Sessão em grupo com tema definido }

    TiposSessaoResponse:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items: { $ref: '#/components/schemas/TipoSessaoInfo' }
      example:
        tipos:
          - { codigo: Individual,   nome: Individual,           duracaoMinutos: 50, minParticipantes: 1, maxParticipantes: 1,  categoria: Individual, descricao: Atendimento individual de psicologia }
          - { codigo: Casal,        nome: Casal,                duracaoMinutos: 60, minParticipantes: 1, maxParticipantes: 2,  categoria: Individual, descricao: Sessão para casal }
          - { codigo: Consultoria,  nome: Consultoria por fase, duracaoMinutos: 60, minParticipantes: 1, maxParticipantes: 1,  categoria: Individual, descricao: Orientação sobre uma fase do ciclo }
          - { codigo: RodaConversa, nome: Roda de Conversa,     duracaoMinutos: 60, minParticipantes: 3, maxParticipantes: 12, categoria: Grupo,      descricao: Sessão em grupo com tema definido }
          - { codigo: TerapiaGrupo, nome: Terapia em Grupo,     duracaoMinutos: 90, minParticipantes: 3, maxParticipantes: 8,  categoria: Grupo,      descricao: Terapia em grupo com acompanhamento contínuo }

    # ── Slots ──────────────────────────────────────────────────

    Slot:
      type: object
      required: [inicio, fim]
      properties:
        inicio: { type: string, format: date-time, example: '2026-08-12T12:00:00Z' }
        fim: { type: string, format: date-time, example: '2026-08-12T12:50:00Z' }

    SlotsResponse:
      type: object
      required: [profissionalId, tipo, duracaoMinutos, valor, slots]
      properties:
        profissionalId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoSessao' }
        duracaoMinutos: { type: integer, enum: [50, 60, 90], example: 50 }
        valor: { type: number, format: double, example: 250.00 }
        slots:
          type: array
          description: Ordenados por `inicio`. Lista vazia é resposta válida.
          items: { $ref: '#/components/schemas/Slot' }
      example:
        profissionalId: 3f2a8c1e-9b4d-4e7a-8c1f-2d5e6a7b8c9d
        tipo: Individual
        duracaoMinutos: 50
        valor: 250.00
        slots:
          - { inicio: '2026-08-12T12:00:00Z', fim: '2026-08-12T12:50:00Z' }
          - { inicio: '2026-08-12T13:00:00Z', fim: '2026-08-12T13:50:00Z' }
          - { inicio: '2026-08-12T14:00:00Z', fim: '2026-08-12T14:50:00Z' }

    # ── Participante ───────────────────────────────────────────

    UsuariaResumo:
      type: object
      required: [id, nome]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Marina Costa }
        foto: { type: string, format: uri, nullable: true }
        noShowCount:
          type: integer
          nullable: true
          description: |
            Faltas sem aviso no histórico (D5). Campo derivado, calculado pelo backend.
            **Visível apenas para a profissional** — `null` nas demais respostas.
          example: 0
        exigePagamentoAntecipado:
          type: boolean
          nullable: true
          description: |
            `true` quando `noShowCount >= 1` (D5). Sem efeito financeiro no MVP, pois o
            Módulo de Pagamento não está ativo — serve como alerta para a profissional.
            **Visível apenas para a profissional.**
          example: false

    Participante:
      type: object
      required: [id, usuaria, inscritaEm]
      properties:
        id: { type: string, format: uuid }
        usuaria: { $ref: '#/components/schemas/UsuariaResumo' }
        compareceu:
          type: boolean
          nullable: true
          description: Marcado pela profissional após a sessão. `null` antes disso.
        inscritaEm: { type: string, format: date-time }
        saiuEm:
          type: string
          format: date-time
          nullable: true
          description: |
            Preenchido na desistência (soft delete). Quem tem `saiuEm` não conta em
            `vagasDisponiveis`, mas permanece no histórico (D7).

    # ── Sessão ─────────────────────────────────────────────────

    SessaoResumo:
      type: object
      description: Forma reduzida usada em listagens.
      required: [id, tipo, dataHora, duracaoMinutos, status, profissional]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoSessao' }
        dataHora: { type: string, format: date-time, example: '2026-08-12T14:00:00Z' }
        duracaoMinutos: { type: integer, enum: [50, 60, 90] }
        status: { $ref: '#/components/schemas/StatusSessao' }
        profissional: { $ref: '#/components/schemas/ProfissionalResumo' }
        tituloGrupo: { type: string, nullable: true, example: 'Ciclos e transições' }
        vagas: { type: integer, nullable: true, description: Capacidade máxima. Apenas em grupo. }
        vagasDisponiveis:
          type: integer
          nullable: true
          description: |
            Calculado pelo backend, já descontando desistências (D7).
            O frontend **nunca** deve calcular vagas a partir da lista de participantes.
        totalParticipantes: { type: integer, nullable: true }
        valorPraticado: { type: number, format: double, description: Valor por participante. }
        linkMeetStatus: { $ref: '#/components/schemas/LinkMeetStatus' }
        pendenteRegistro:
          type: boolean
          nullable: true
          description: |
            `true` quando o horário já passou e a sessão continua ativa, aguardando o
            registro da profissional. Preenchido apenas em `GET /profissional/agenda`.

            **Existe para o frontend não comparar datas.** Sem este campo, a tela
            precisaria de `dataHora < agora && status ∈ {Agendada, Confirmada}` — uma
            regra de negócio no componente, que erra em virada de fuso e some do lugar
            certo quando a regra mudar.
          example: false
        jaInscrita:
          type: boolean
          nullable: true
          description: |
            Se a usuária autenticada já está inscrita nesta sessão de grupo.
            Preenchido apenas em `GET /grupos`; nulo nas demais listagens.

            **Existe para decidir o rótulo do botão sem uma segunda requisição.**
            Sem este campo, a lista de grupos precisaria ser cruzada com
            `GET /usuaria/sessoes` no cliente para saber se o botão diz
            "Inscrever-se" ou "Você já está inscrita".
          example: false
        participanteNome:
          type: string
          nullable: true
          description: |
            Nome da participante da sessão individual ou de casal, para a agenda da
            profissional. Preenchido apenas em `GET /profissional/agenda`; nulo nas
            listagens da usuária (onde seria o próprio nome dela) e em sessões de grupo
            (que se identificam por `tituloGrupo`).

            **Existe para a profissional ver de relance com quem é cada atendimento.**
            Sem este campo, `SessaoResumo` só traz `profissional` — no painel dela, o
            nome dela mesma — e a agenda cairia no nome do tipo ("Individual"), sem
            dizer quem. Espelha `pendenteRegistro`/`jaInscrita`: opcional, preenchido
            por contexto, nunca calculado no cliente.
          example: Ana Souza
        canceladaPor:
          allOf: [{ $ref: '#/components/schemas/CanceladoPor' }]
          nullable: true
          description: |
            Quem cancelou, quando `status` é `Cancelada`; nulo nos demais status.

            **Existe para a agenda separar cancelamento da usuária do da própria
            profissional.** A métrica "canceladas nos últimos 14 dias" quer dizer
            "desmarcaram comigo" — sem este campo ela somava também os cancelamentos
            que a profissional fez, atribuindo a ela mesma o que ela decidiu. Só existia
            em `Sessao` (o detalhe), e buscar o detalhe de cada item da listagem para
            contar seria N requisições por página.

    SessaoGrupoPublica:
      type: object
      description: |
        Detalhe público de uma sessão de grupo aberta a inscrições — a tela que precede
        o botão "Inscrever-se", vista por qualquer usuária autenticada. Não traz
        `participantes`, `linkMeet` nem histórico de ninguém; só o necessário para decidir
        a inscrição.
      required:
        [id, tipo, dataHora, duracaoMinutos, status, profissional, tituloGrupo, vagas,
         vagasDisponiveis, valorPraticado, jaInscrita]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoSessao' }
        dataHora: { type: string, format: date-time, example: '2026-08-20T18:00:00Z' }
        duracaoMinutos: { type: integer, enum: [50, 60, 90], example: 60 }
        status: { $ref: '#/components/schemas/StatusSessao' }
        profissional: { $ref: '#/components/schemas/ProfissionalResumo' }
        tituloGrupo: { type: string, example: 'Ciclos e transições' }
        vagas: { type: integer, description: Capacidade máxima. }
        vagasDisponiveis:
          type: integer
          description: Calculado pelo backend, já descontando desistências (D7).
        valorPraticado: { type: number, format: double, description: Valor por participante (D6). }
        jaInscrita:
          type: boolean
          description: |
            Se a usuária autenticada já está inscrita nesta sessão. Existe para a tela
            decidir o rótulo do botão ("Inscrever-se" vs "Você já está inscrita" / "Sair")
            sem uma segunda requisição.
          example: false

    Sessao:
      type: object
      description: Forma completa, usada no detalhe e nas respostas de escrita.
      required:
        [id, tipo, dataHora, dataHoraFim, duracaoMinutos, status, profissional,
         valorPraticado, participantes, criadaEm, atualizadaEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoSessao' }
        dataHora: { type: string, format: date-time, example: '2026-08-12T14:00:00Z' }
        dataHoraFim:
          type: string
          format: date-time
          description: Calculado como `dataHora + duracaoMinutos`. Evita duplicar a conta no frontend.
          example: '2026-08-12T14:50:00Z'
        duracaoMinutos: { type: integer, enum: [50, 60, 90], example: 50 }
        status: { $ref: '#/components/schemas/StatusSessao' }
        profissional: { $ref: '#/components/schemas/ProfissionalResumo' }
        participantes:
          type: array
          items: { $ref: '#/components/schemas/Participante' }
        convitePendente:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ConviteResumo'
          description: Convite de casal ainda não aceito (D4). Nulo quando não há convite.
        linkMeet:
          type: string
          format: uri
          nullable: true
          maxLength: 500
          description: |
            **Regra de visibilidade (D14):** `null` até 30 minutos antes do início.
            O backend controla essa janela; o frontend apenas exibe o que recebe e
            nunca esconde nem revela o link por conta própria.
          example: null
        linkMeetDisponivelEm:
          type: string
          format: date-time
          nullable: true
          description: Instante a partir do qual `linkMeet` será preenchido (`dataHora - 30min`).
          example: '2026-08-12T13:30:00Z'
        linkMeetStatus: { $ref: '#/components/schemas/LinkMeetStatus' }
        vagas: { type: integer, nullable: true }
        vagasDisponiveis: { type: integer, nullable: true, description: Calculado pelo backend (D7). }
        tituloGrupo: { type: string, nullable: true, maxLength: 200 }
        valorPraticado:
          type: number
          format: double
          description: |
            Snapshot do valor no momento do agendamento, **por participante** (D6).
            Não muda se a profissional alterar seus valores depois.
          example: 250.00
        podeCancelarSemCobranca:
          type: boolean
          description: |
            Calculado pelo backend: `true` se faltam mais de 24h. O frontend usa para
            decidir se exibe o aviso de cobrança antes de confirmar — mas a decisão
            final é sempre do backend.
          example: true
        podeReagendar:
          type: boolean
          description: '`false` dentro das 24h ou em sessão de grupo (D9).'
          example: true
        podeCancelar:
          type: boolean
          description: |
            `true` enquanto a sessão está em `Agendada` ou `Confirmada` — inclusive
            depois do horário, enquanto o registro não foi feito (PF7 permite o
            cancelamento pela profissional a qualquer momento).

            Existe para a tela não decidir isso sozinha. A regra de quem pode cancelar
            e até quando difere entre usuária e profissional e tende a mudar; o
            componente só lê o booleano.
          example: true
        pendenteRegistro:
          type: boolean
          description: |
            `true` quando o horário já passou e a sessão continua ativa. É o que
            habilita a ação de registrar o que aconteceu, sem comparação de datas
            no frontend.
          example: false
        canceladaPor: { $ref: '#/components/schemas/CanceladoPor' }
        canceladaEm: { type: string, format: date-time, nullable: true }
        motivoCancelamento: { type: string, nullable: true }
        criadaEm: { type: string, format: date-time }
        atualizadaEm: { type: string, format: date-time }

    MarcarSessaoInput:
      type: object
      required: [profissionalId, tipo, dataHora]
      properties:
        profissionalId: { type: string, format: uuid }
        tipo:
          $ref: '#/components/schemas/TipoSessao'
        dataHora:
          type: string
          format: date-time
          description: Início escolhido, UTC. Precisa corresponder a um slot disponível.
          example: '2026-08-12T14:00:00Z'
        emailParceira:
          type: string
          format: email
          nullable: true
          description: |
            Apenas para `tipo: Casal` (D4). Se já cadastrada, vira participante direto.
            Se não, recebe um convite por e-mail. Em nenhum caso bloqueia a sessão.
          example: parceira@exemplo.com
      example:
        profissionalId: 3f2a8c1e-9b4d-4e7a-8c1f-2d5e6a7b8c9d
        tipo: Individual
        dataHora: '2026-08-12T14:00:00Z'

    SessaoGrupoInput:
      type: object
      required: [tipo, dataHora, titulo, vagas]
      properties:
        tipo:
          allOf:
            - $ref: '#/components/schemas/TipoSessao'
          description: Apenas `RodaConversa` ou `TerapiaGrupo`.
        dataHora: { type: string, format: date-time, example: '2026-08-20T18:00:00Z' }
        titulo: { type: string, maxLength: 200, example: 'Ciclos e transições' }
        vagas:
          type: integer
          minimum: 3
          maximum: 12
          description: |
            Capacidade máxima. Limite por tipo (D11, configurável no backend):
            RodaConversa 3 a 12, TerapiaGrupo 3 a 8.
          example: 10
      example:
        tipo: RodaConversa
        dataHora: '2026-08-20T18:00:00Z'
        titulo: Ciclos e transições
        vagas: 10

    CancelamentoResponse:
      type: object
      required: [sessao, cobrancaAplicada]
      properties:
        sessao: { $ref: '#/components/schemas/Sessao' }
        cobrancaAplicada:
          type: boolean
          description: |
            `true` quando o cancelamento ocorreu com menos de 24h de antecedência
            e foi feito pela usuária. Sem efeito financeiro enquanto o Módulo de
            Pagamento não estiver ativo — serve para a mensagem de confirmação.
          example: false
        percentualCobrado:
          type: number
          format: double
          nullable: true
          description: Percentual do valor cobrado. `50` na regra atual.
          example: null

    # ── Convite ────────────────────────────────────────────────

    ConviteResumo:
      type: object
      required: [id, emailMascarado, status, expiraEm]
      properties:
        id: { type: string, format: uuid }
        emailMascarado: { type: string, example: 'p*****a@exemplo.com' }
        status: { $ref: '#/components/schemas/StatusConvite' }
        expiraEm:
          type: string
          format: date-time
          description: Igual a `sessao.dataHora` — não faz sentido aceitar depois da sessão.

    ConvitePublico:
      type: object
      description: |
        Dados mínimos para a tela pública de aceite. Não expõe o e-mail completo
        nem dados da usuária que convidou.
      required: [status, emailMascarado, expiraEm, tipo, dataHora, duracaoMinutos, profissional]
      properties:
        status: { $ref: '#/components/schemas/StatusConvite' }
        emailMascarado: { type: string, example: 'p*****a@exemplo.com' }
        expiraEm: { type: string, format: date-time }
        tipo: { $ref: '#/components/schemas/TipoSessao' }
        dataHora: { type: string, format: date-time }
        duracaoMinutos: { type: integer, example: 60 }
        profissional: { $ref: '#/components/schemas/ProfissionalResumo' }
        nomeQuemConvidou: { type: string, example: Marina }
